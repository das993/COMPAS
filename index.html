<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosotros dos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2B4F;--muted:#5E6C8A;--card:#fff;--line:#D5E3F2;--pink:#FF5A7A;--sun:#FFD23F;--teal:#14B8A6;--radius:16px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.65 Figtree,system-ui,sans-serif;background:linear-gradient(#EAF6FF,#FFF9E3) fixed}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{background:var(--sun);padding:30px 0 22px;border-radius:0 0 28px 28px;box-shadow:0 6px 20px rgba(255,180,0,.25)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.top h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{background:rgba(255,255,255,.6);border:0;border-radius:99px;padding:10px 20px;font-weight:600}
.tab[aria-selected=true]{background:var(--ink);color:var(--sun)}
main{padding:44px 0 90px}
.sub{display:flex;gap:10px;margin-bottom:28px}
.pill{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:8px 20px;font-weight:600}
.pill[aria-selected=true]{background:var(--pink);border-color:var(--pink);color:#fff}
.btn{background:var(--pink);color:#fff;border:0;border-radius:99px;padding:11px 22px;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:6px 14px;font-size:.9rem}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.95rem}
.scene{border-radius:26px;overflow:hidden;box-shadow:0 12px 34px rgba(29,43,79,.14);background:#fff}
.banner{position:relative;height:230px}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:relative;padding:36px 36px}
.ttl h2{font-size:clamp(2rem,5vw,2.8rem);font-weight:800}
.ttl p{margin:6px 0 0}
.night .ttl{color:#fff}
.inner{padding:36px}
#s-nacional .inner{background:linear-gradient(#FFF8DC,#fff)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:20px 36px;margin-bottom:28px}
.big{font-family:'Bricolage Grotesque';font-size:2.6rem;font-weight:800;line-height:1;color:var(--pink)}
.barw{flex:1;min-width:160px}
.bar{height:12px;background:#E3ECF5;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink));width:0;transition:width .4s}
.mapbox{background:#CDEBFB;border-radius:22px;padding:24px;max-width:820px;margin:0 auto}
#map{width:100%;height:auto;display:block}
.prov{fill:color-mix(in srgb,var(--c) 28%,#fff);stroke:#fff;stroke-width:1.6;stroke-linejoin:round;cursor:pointer;transition:fill .2s}
.prov:hover{fill:color-mix(in srgb,var(--c) 60%,#fff)}
.prov.on{fill:var(--c)}
.prov.tiny{stroke:var(--c);stroke-width:8}
#msg{text-align:center;margin:18px 0 0;min-height:1.7em}
.pop{position:fixed;pointer-events:none;font-size:22px;z-index:50;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop{display:none}}
#s-internacional .inner{background:linear-gradient(#12356B,#0B2447)}
.board{background:#0A1226;border-radius:18px;padding:26px;color:#FFC933;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:.05em}
.board h3{font-size:1.4rem;margin-bottom:12px;text-transform:uppercase}
.brow{display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:16px;padding:14px 4px;border-bottom:1px solid #1E2A4A;align-items:center}
.ok{color:#5CF2A5;font-size:.85rem}
.x{background:none;border:0;color:#8A97B8;font-size:1.3rem}
.bform{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.bform input{flex:1;min-width:150px;padding:10px 14px;border-radius:10px;border:1px solid #2A3A66;background:#111C3A;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:0;border-top:7px solid var(--a,var(--pink));border-radius:var(--radius);padding:24px;text-align:left;box-shadow:0 6px 18px rgba(29,43,79,.1);transition:transform .15s}
button.card:hover{transform:translateY(-4px)}
.card h3{font-size:1.25rem;margin-bottom:8px}
.panel{background:var(--card);border-radius:var(--radius);padding:28px;margin-bottom:30px;box-shadow:0 6px 18px rgba(29,43,79,.1)}
label{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px}
input[type=text],select,textarea{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:#F8FBFF}
.field{margin-bottom:22px}
.crit{display:grid;grid-template-columns:120px 1fr 44px;gap:14px;align-items:center;margin-bottom:12px}
.crit input{accent-color:var(--pink)}
.crit output{text-align:right;font-weight:600}
.items{display:grid;gap:22px}
.item{display:grid;grid-template-columns:130px 1fr auto;gap:22px;background:var(--card);border-radius:var(--radius);padding:18px;align-items:center;box-shadow:0 6px 18px rgba(29,43,79,.1)}
.item img,.ph{width:130px;height:100px;object-fit:cover;border-radius:12px;background:#DCEBF7}
.item h3{margin-bottom:8px}
.score{font-family:'Bricolage Grotesque';font-size:2.3rem;font-weight:800;color:var(--pink);text-align:right;line-height:1}
.mini{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
.mini b{color:var(--ink)}
@media(max-width:560px){.inner{padding:20px}.item{grid-template-columns:90px 1fr}.item img,.ph{width:90px;height:70px}.score{grid-column:1/-1;text-align:left}.crit{grid-template-columns:80px 1fr 40px}.brow{grid-template-columns:1fr auto}.ttl{padding:26px 22px}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 22px}
.tag{background:#FFE3EA;border-radius:99px;padding:3px 12px;font-size:.92rem}
.tag button{background:none;border:0;padding:0 0 0 6px}
footer{padding:24px 0 40px;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>Nosotros dos</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="trotamundos">🧭 Trotamundos</button>
      <button class="tab" role="tab" data-view="rankings">🏆 Rankings</button>
    </nav>
  </div>
</div></header>

<main class="wrap">
  <!-- TROTAMUNDOS -->
  <section id="v-trotamundos">
    <div class="sub" role="tablist">
      <button class="pill" role="tab" data-sub="nacional">Nacional</button>
      <button class="pill" role="tab" data-sub="internacional">Internacional</button>
    </div>
    <div id="s-nacional" class="scene">
      <div class="banner">
        <svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <rect width="1200" height="230" fill="#BFE8FF"/><circle cx="1040" cy="60" r="38" fill="#FFE27A"/>
          <ellipse cx="620" cy="50" rx="80" ry="20" fill="#fff" opacity=".85"/><ellipse cx="690" cy="38" rx="50" ry="16" fill="#fff" opacity=".85"/>
          <path d="M0 150 Q200 80 420 140 T820 120 T1200 100 V230 H0Z" fill="#A5DB6B"/>
          <path d="M0 185 Q260 120 560 175 T1200 150 V230 H0Z" fill="#6EC24B"/>
          <path d="M0 215 Q300 175 640 210 T1200 195 V230 H0Z" fill="#3FA34D"/>
          <path id="rd" d="M900 232 C820 205 990 185 880 165 S810 140 850 120" fill="none" stroke="#59606B" stroke-width="30" stroke-linecap="round"/>
          <path d="M900 232 C820 205 990 185 880 165 S810 140 850 120" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="12 14"/>
          <circle cx="560" cy="170" r="14" fill="#2E8B45"/><rect x="557" y="178" width="6" height="14" fill="#7A5230"/><circle cx="600" cy="176" r="10" fill="#2E8B45"/><rect x="598" y="182" width="4" height="10" fill="#7A5230"/>
        </svg>
        <div class="ttl"><h2>Por España</h2><p>Provincias que hemos pisado juntos</p></div>
      </div>
      <div class="inner">
        <div class="stats">
          <div><span class="big"><span id="n">0</span>/52</span><div class="muted">provincias</div></div>
          <div class="barw"><div class="bar"><i id="bar"></i></div></div>
          <div><span class="big" id="full">0</span><div class="muted">comunidades completas</div></div>
        </div>
        <div class="mapbox"><svg id="map" role="group" aria-label="Mapa de provincias de España"></svg></div>
        <p id="msg" class="muted" aria-live="polite">Toca una provincia para marcarla como visitada.</p>
      </div>
    </div>
    <div id="s-internacional" class="scene hidden">
      <div class="banner night">
        <svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <rect width="1200" height="230" fill="#0B2447"/>
          <g fill="#fff" opacity=".8"><circle cx="120" cy="40" r="2"/><circle cx="300" cy="90" r="2"/><circle cx="520" cy="30" r="2"/><circle cx="760" cy="70" r="2"/><circle cx="980" cy="35" r="2"/><circle cx="1120" cy="95" r="2"/></g>
          <path d="M850 230 L910 110 L1010 110 L1090 230Z" fill="#2B2F3A"/>
          <path d="M960 230 L960 110" stroke="#fff" stroke-width="4" stroke-dasharray="14 12"/>
          <g fill="#FFC933"><circle cx="880" cy="170" r="4"/><circle cx="905" cy="120" r="3"/><circle cx="1050" cy="170" r="4"/><circle cx="1012" cy="120" r="3"/></g>
          <text x="640" y="110" font-size="60" transform="rotate(-18 640 110)">✈️</text>
        </svg>
        <div class="ttl"><h2>Internacional</h2><p>Próximas salidas y destinos ya visitados</p></div>
      </div>
      <div class="inner">
        <div class="board"><h3>Salidas</h3><div id="brows"></div>
          <form id="board-form" class="bform"><input id="bd-name" type="text" placeholder="País o ciudad" aria-label="Destino" required><input id="bd-note" type="text" placeholder="Cuándo o una nota" aria-label="Nota"><button class="btn" type="submit">Añadir destino</button></form>
        </div>
      </div>
    </div>
  </section>

  <!-- RANKINGS -->
  <section id="v-rankings" class="hidden">
    <div id="r-list">
      <div class="row"><h2>Nuestros rankings</h2><button class="btn" id="new-rank">Crear ranking</button></div>
      <form id="rank-form" class="panel hidden">
        <div class="field"><label for="rk-name">Nombre del ranking</label><input type="text" id="rk-name" placeholder="Hoteles, restaurantes, playas…" required></div>
        <div class="field"><label for="rk-crit">Categorías de puntuación</label>
          <input type="text" id="rk-crit" placeholder="Escribe una y pulsa Intro (cama, tele, comida…)">
          <div class="tags" id="rk-tags"></div></div>
        <button class="btn" type="submit">Guardar ranking</button>
        <button class="btn ghost" type="button" id="rk-cancel">Cancelar</button>
      </form>
      <div class="cards" id="rank-cards"></div>
    </div>

    <div id="r-detail" class="hidden">
      <div class="row">
        <div><button class="btn ghost small" id="back">Volver</button></div>
        <div><button class="btn ghost small" id="edit-cats">Editar categorías</button> <button class="btn ghost small" id="del-rank">Borrar ranking</button></div>
      </div>
      <h2 id="rd-title" style="margin-bottom:16px"></h2>
      <form id="item-form" class="panel">
        <h3 id="if-title" style="margin-bottom:14px">Añadir elemento</h3>
        <div class="field"><label for="it-name">Nombre</label><input type="text" id="it-name" required></div>
        <div class="field"><label for="it-photo">Foto</label><input type="file" id="it-photo" accept="image/*"><img id="it-prev" class="hidden" alt="Vista previa" style="max-width:160px;margin-top:8px;border-radius:8px"></div>
        <div id="it-scores"></div>
        <div class="field"><label for="it-notes">Comentario</label><textarea id="it-notes" rows="2"></textarea></div>
        <button class="btn" type="submit" id="if-save">Añadir</button>
        <button class="btn ghost hidden" type="button" id="if-cancel">Cancelar edición</button>
      </form>
      <div class="row">
        <div><label for="sort" style="display:inline;margin-right:8px">Ordenar por</label>
          <select id="sort" style="width:auto"></select></div>
        <span class="muted" id="count-items"></span>
      </div>
      <div class="items" id="items"></div>
    </div>
  </section>
</main>

<footer><div class="wrap">
  Los datos se guardan en este navegador.
  <button class="btn ghost small" id="export">Exportar copia</button>
  <label class="btn ghost small" style="display:inline-block;margin:0;font-weight:500;cursor:pointer">Importar copia<input type="file" id="import" accept="application/json" class="hidden"></label>
</div></footer>

<script src="spain-map.js"></script>
<script>
const KEY='nosotros-dos-v1';
let state={visited:{},rankings:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rankings)state=s}catch(e){}
state.countries=state.countries||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('No hay espacio para guardar. Prueba con fotos más pequeñas o exporta una copia.')}}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* navegación */
let view='trotamundos', sub='nacional', currentRank=null;
function show(){
  $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===view));
  $$('.pill').forEach(b=>b.setAttribute('aria-selected',b.dataset.sub===sub));
  $('#v-trotamundos').classList.toggle('hidden',view!=='trotamundos');
  $('#v-rankings').classList.toggle('hidden',view!=='rankings');
  $('#s-nacional').classList.toggle('hidden',sub!=='nacional');
  $('#s-internacional').classList.toggle('hidden',sub!=='internacional');
  $('#r-list').classList.toggle('hidden',!!currentRank);
  $('#r-detail').classList.toggle('hidden',!currentRank);
}
$$('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;show()});
$$('.pill').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;show()});

/* mapa */
const M=window.SPAIN_MAP, NS='http://www.w3.org/2000/svg', svg=$('#map');
svg.setAttribute('viewBox',`0 0 ${M.w} ${M.h}`);
M.provinces.forEach(p=>{
  const el=document.createElementNS(NS,'path');
  el.setAttribute('d',p.d);el.setAttribute('class','prov'+(['51','52'].includes(p.id)?' tiny':''));el.dataset.id=p.id;el.style.setProperty('--c',M.ccaa[p.c].k);el.onmouseenter=()=>$('#msg').textContent=p.name+' · '+M.ccaa[p.c].n;
  el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',p.name);
  const t=document.createElementNS(NS,'title');t.textContent=p.name;el.appendChild(t);
  el.onclick=e=>toggle(p.id,e);
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(p.id)}};
  svg.appendChild(el);
});
const fr=document.createElementNS(NS,'rect');
[['x',0],['y',1],['width',2],['height',3]].forEach(([k,i])=>fr.setAttribute(k,M.frame[i]));
fr.setAttribute('fill','none');fr.setAttribute('stroke','var(--muted)');fr.setAttribute('stroke-dasharray','6 6');fr.setAttribute('pointer-events','none');
svg.prepend(fr);
const byName=Object.fromEntries(M.provinces.map(p=>[p.id,p]));
function toggle(id,ev){
  const on=!state.visited[id];if(on)state.visited[id]=true;else delete state.visited[id];
  save();paintMap();const p=byName[id];$('#msg').textContent=p.name+' · '+M.ccaa[p.c].n+(on?' ✔ visitada':' (quitada)');
  if(on&&ev&&ev.clientX&&!matchMedia('(prefers-reduced-motion:reduce)').matches)for(let i=0;i<10;i++){const e=document.createElement('span');e.className='pop';e.textContent=['🎉','✨','📍','💖'][i%4];e.style.left=ev.clientX+'px';e.style.top=ev.clientY+'px';e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.setProperty('--dy',(Math.random()*-120-20)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
}
function paintMap(){
  $$('.prov').forEach(e=>e.classList.toggle('on',!!state.visited[e.dataset.id]));
  const n=Object.keys(state.visited).length;$('#n').textContent=n;$('#bar').style.width=(n/52*100)+'%';
  const tot={},got={};M.provinces.forEach(p=>{tot[p.c]=(tot[p.c]||0)+1;if(state.visited[p.id])got[p.c]=(got[p.c]||0)+1});
  $('#full').textContent=Object.keys(tot).filter(c=>got[c]===tot[c]).length;
}
function renderBoard(){
  const b=$('#brows');b.innerHTML=state.countries.length?'':'<div class="brow"><span>Sin destinos todavía</span></div>';
  state.countries.forEach(c=>{const r=document.createElement('div');r.className='brow';
    r.innerHTML=`<span>✈ ${esc(c.name)}</span><span>${esc(c.note||'')}</span><span class="ok">EMBARCADO</span><button class="x" aria-label="Quitar ${esc(c.name)}">×</button>`;
    r.querySelector('.x').onclick=()=>{state.countries=state.countries.filter(x=>x.id!==c.id);save();renderBoard()};b.appendChild(r)});
}
$('#board-form').onsubmit=e=>{e.preventDefault();const n=$('#bd-name').value.trim();if(!n)return;state.countries.push({id:uid(),name:n,note:$('#bd-note').value.trim()});save();e.target.reset();renderBoard()};

/* rankings */
let draftCats=[];
const avg=(it,cats)=>{const v=cats.map(c=>it.scores[c]).filter(x=>typeof x==='number');return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const fmt=n=>n.toFixed(1).replace('.',',');
function renderTags(){
  $('#rk-tags').innerHTML=draftCats.map((c,i)=>`<span class="tag">${esc(c)}<button type="button" data-i="${i}" aria-label="Quitar ${esc(c)}">×</button></span>`).join('');
  $$('#rk-tags button').forEach(b=>b.onclick=()=>{draftCats.splice(+b.dataset.i,1);renderTags()});
}
let editingCats=false, editRankId=null;
$('#new-rank').onclick=()=>{editingCats=false;draftCats=[];$('#rk-name').value='';renderTags();$('#rank-form').classList.remove('hidden');$('#rk-name').focus()};
$('#rk-cancel').onclick=()=>$('#rank-form').classList.add('hidden');
$('#rk-crit').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v&&!draftCats.includes(v))draftCats.push(v);e.target.value='';renderTags()}};
$('#rank-form').onsubmit=e=>{
  e.preventDefault();
  const pending=$('#rk-crit').value.trim();if(pending&&!draftCats.includes(pending))draftCats.push(pending);$('#rk-crit').value='';
  if(!draftCats.length){alert('Añade al menos una categoría de puntuación.');return}
  if(editingCats){const r=state.rankings.find(x=>x.id===editRankId);r.name=$('#rk-name').value.trim();r.criteria=[...draftCats];$('#rank-form').classList.add('hidden');save();openRank(r.id);return}
  const r={id:uid(),name:$('#rk-name').value.trim(),criteria:[...draftCats],items:[]};
  state.rankings.push(r);save();$('#rank-form').classList.add('hidden');renderRankList();
};
function renderRankList(){
  const box=$('#rank-cards');
  box.innerHTML=state.rankings.length?'':'<p class="muted">Aún no hay rankings. Crea el primero, por ejemplo “Hoteles”.</p>';
  state.rankings.forEach((r,i)=>{
    const b=document.createElement('button');b.className='card';b.style.setProperty('--a',['#FF5A7A','#14B8A6','#FFB703','#6C63FF','#3A86FF'][i%5]);
    b.innerHTML=`<h3>${esc(r.name)}</h3><div class="muted">${r.items.length} elementos</div><div class="muted">${r.criteria.map(esc).join(', ')}</div>`;
    b.onclick=()=>openRank(r.id);box.appendChild(b);
  });
}
const cur=()=>state.rankings.find(r=>r.id===currentRank);
function openRank(id){currentRank=id;resetForm();renderDetail();show();window.scrollTo(0,0)}
$('#back').onclick=()=>{currentRank=null;$('#rank-form').classList.add('hidden');renderRankList();show()};
$('#del-rank').onclick=()=>{if(confirm('¿Borrar este ranking con todos sus elementos?')){state.rankings=state.rankings.filter(r=>r.id!==currentRank);save();$('#back').onclick()}};
$('#edit-cats').onclick=()=>{
  const r=cur();editingCats=true;editRankId=r.id;draftCats=[...r.criteria];$('#rk-name').value=r.name;renderTags();
  $('#back').onclick();$('#rank-form').classList.remove('hidden');
};

let editId=null, photoData=null;
function resetForm(){
  editId=null;photoData=null;$('#item-form').reset();$('#it-prev').classList.add('hidden');
  $('#if-title').textContent='Añadir elemento';$('#if-save').textContent='Añadir';$('#if-cancel').classList.add('hidden');
  const r=cur();if(!r)return;
  $('#it-scores').innerHTML=r.criteria.map((c,i)=>`<div class="crit"><label for="sc${i}" style="margin:0">${esc(c)}</label><input type="range" id="sc${i}" data-c="${esc(c)}" min="0" max="10" step="0.5" value="5"><output id="o${i}">5</output></div>`).join('');
  $$('#it-scores input').forEach((s,i)=>s.oninput=()=>$('#o'+i).textContent=s.value.replace('.',','));
}
$('#if-cancel').onclick=resetForm;
function resize(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};
  img.src=u})}
$('#it-photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;photoData=await resize(f);$('#it-prev').src=photoData;$('#it-prev').classList.remove('hidden')};
$('#item-form').onsubmit=e=>{
  e.preventDefault();const r=cur(),scores={};
  $$('#it-scores input').forEach(s=>scores[s.dataset.c]=parseFloat(s.value));
  const data={name:$('#it-name').value.trim(),notes:$('#it-notes').value.trim(),scores};
  if(editId){const it=r.items.find(x=>x.id===editId);Object.assign(it,data);if(photoData)it.photo=photoData}
  else r.items.push({id:uid(),photo:photoData||null,...data});
  save();resetForm();renderDetail();
};
function renderDetail(){
  const r=cur();if(!r)return;
  $('#rd-title').textContent=r.name;
  const sel=$('#sort'),prev=sel.value;
  sel.innerHTML=`<option value="__g">Nota global</option>`+r.criteria.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value=[...sel.options].some(o=>o.value===prev)?prev:'__g';
  const key=sel.value,score=it=>key==='__g'?avg(it,r.criteria):(it.scores[key]??0);
  const list=[...r.items].sort((a,b)=>score(b)-score(a));
  $('#count-items').textContent=list.length+' elementos';
  $('#items').innerHTML=list.length?'':'<p class="muted">Todavía no hay elementos. Añade el primero arriba.</p>';
  list.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`${it.photo?`<img src="${it.photo}" alt="${esc(it.name)}">`:'<div class="ph"></div>'}
      <div><h3>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(it.name)}</h3>
      <div class="mini">${r.criteria.map(c=>`<span>${esc(c)} <b>${it.scores[c]!==undefined?fmt(it.scores[c]):'–'}</b></span>`).join('')}</div>
      ${it.notes?`<div class="muted" style="margin-top:6px">${esc(it.notes)}</div>`:''}
      <div style="margin-top:8px"><button class="btn ghost small" data-e="${it.id}">Editar</button> <button class="btn ghost small" data-d="${it.id}">Borrar</button></div></div>
      <div><div class="score">${fmt(score(it))}</div><div class="muted" style="text-align:right">${key==='__g'?'global':esc(key)}</div></div>`;
    $('#items').appendChild(d);
  });
  $$('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('¿Borrar este elemento?')){r.items=r.items.filter(x=>x.id!==b.dataset.d);save();renderDetail()}});
  $$('[data-e]').forEach(b=>b.onclick=()=>{
    const it=r.items.find(x=>x.id===b.dataset.e);resetForm();editId=it.id;
    $('#it-name').value=it.name;$('#it-notes').value=it.notes||'';
    $$('#it-scores input').forEach((s,i)=>{const v=it.scores[s.dataset.c];if(v!==undefined){s.value=v;$('#o'+i).textContent=String(v).replace('.',',')}});
    if(it.photo){$('#it-prev').src=it.photo;$('#it-prev').classList.remove('hidden')}
    $('#if-title').textContent='Editar elemento';$('#if-save').textContent='Guardar cambios';$('#if-cancel').classList.remove('hidden');
    $('#item-form').scrollIntoView({behavior:'smooth'});
  });
}
$('#sort').onchange=renderDetail;

/* copia de seguridad */
$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='nosotros-dos-copia.json';a.click()};
$('#import').onchange=async e=>{
  try{const s=JSON.parse(await e.target.files[0].text());if(!s.rankings||!s.visited)throw 0;
    if(confirm('Esto reemplaza los datos de este navegador. ¿Continuar?')){state=s;state.countries=s.countries||[];save();currentRank=null;paintMap();renderRankList();renderBoard();show()}}
  catch(err){alert('Ese archivo no es una copia válida.')}
  e.target.value='';
};

paintMap();renderRankList();renderBoard();show();
</script>
</body>
</html>
